name: Run JMeter WebSocket Test

on:
  workflow_dispatch:

jobs:
  websocket-test:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Cache JMeter
      # ==========================================
      - name: Cache JMeter
        id: jmeter-cache
        uses: actions/cache@v4
        with:
          path: jmeter-install
          key: jmeter-5.6.3-linux


      # ==========================================
      # 4. Download JMeter
      # ==========================================
      - name: Download JMeter
        if: steps.jmeter-cache.outputs.cache-hit != 'true'
        run: |

          JMETER_VERSION=5.6.3

          echo "=========================================="
          echo "Downloading Apache JMeter ${JMETER_VERSION}"
          echo "=========================================="

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 5 \
            https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz \
            -o apache-jmeter.tgz

          echo ""
          echo "Extracting JMeter..."

          tar -xzf apache-jmeter.tgz

          mv apache-jmeter-${JMETER_VERSION} jmeter-install

          echo ""
          echo "JMeter installation completed."


      # ==========================================
      # 5. Verify JMeter
      # ==========================================
      - name: Verify JMeter
        run: |

          echo "=========================================="
          echo "JMeter Version"
          echo "=========================================="

          ./jmeter-install/bin/jmeter --version


      # ==========================================
      # 6. Verify repository structure
      # ==========================================
      - name: Verify repository structure
        run: |

          echo "=========================================="
          echo "Repository Structure"
          echo "=========================================="

          echo ""
          echo "JMeter directory:"
          find Jmeter -maxdepth 3 -type f -print

          echo ""
          echo "JMX file:"
          ls -lh Jmeter/WebSocket.jmx

          echo ""
          echo "Plugin directory:"
          ls -lh Jmeter/lib/ext/


      # ==========================================
      # 7. Install WebSocket plugin
      # ==========================================
      - name: Install WebSocket plugins
        run: |

          echo "=========================================="
          echo "Installing WebSocket Plugins"
          echo "=========================================="

          mkdir -p jmeter-install/lib/ext

          # --------------------------------------
          # Main WebSocket Sampler plugin
          # --------------------------------------

          cp Jmeter/lib/ext/jmeter-websocket-samplers-1.3.2.jar \
             jmeter-install/lib/ext/


          # --------------------------------------
          # Jetty dependencies
          # --------------------------------------

          cp Jmeter/lib/ext/jetty-http-9.1.1.v20140108.jar \
             jmeter-install/lib/ext/

          cp Jmeter/lib/ext/jetty-io-9.1.1.v20140108.jar \
             jmeter-install/lib/ext/

          cp Jmeter/lib/ext/jetty-util-9.1.1.v20140108.jar \
             jmeter-install/lib/ext/


          # --------------------------------------
          # WebSocket dependencies
          # --------------------------------------

          cp Jmeter/lib/ext/websocket-api-9.1.1.v20140108.jar \
             jmeter-install/lib/ext/

          cp Jmeter/lib/ext/websocket-client-9.1.1.v20140108.jar \
             jmeter-install/lib/ext/

          cp Jmeter/lib/ext/websocket-common-9.1.1.v20140108.jar \
             jmeter-install/lib/ext/


          echo ""
          echo "=========================================="
          echo "Installed WebSocket JARs"
          echo "=========================================="

          ls -lh jmeter-install/lib/ext/


      # ==========================================
      # 8. Verify OpenWebSocketSampler class
      # ==========================================
      - name: Verify WebSocket plugin class
        run: |

          echo "=========================================="
          echo "Verifying OpenWebSocketSampler"
          echo "=========================================="

          PLUGIN_JAR="jmeter-install/lib/ext/jmeter-websocket-samplers-1.3.2.jar"

          if [ ! -f "$PLUGIN_JAR" ]; then

            echo "ERROR:"
            echo "WebSocket sampler JAR not found:"
            echo "$PLUGIN_JAR"

            exit 1

          fi


          echo ""
          echo "Searching for OpenWebSocketSampler..."

          jar tf "$PLUGIN_JAR" \
            | grep "eu/luminis/jmeter/wssampler/OpenWebSocketSampler.class"


          if [ $? -ne 0 ]; then

            echo ""
            echo "ERROR:"
            echo "OpenWebSocketSampler class was not found."

            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "SUCCESS"
          echo "OpenWebSocketSampler class found."
          echo "=========================================="


      # ==========================================
      # 9. Create result directory
      # ==========================================
      - name: Prepare result directory
        run: |

          echo "=========================================="
          echo "Preparing Result Directory"
          echo "=========================================="

          rm -rf Jmeter/results/websocket

          mkdir -p Jmeter/results/websocket/html-report

          echo ""
          echo "Result directory created:"

          find Jmeter/results -maxdepth 3 -type d -print


      # ==========================================
      # 10. Run JMeter WebSocket Test
      # ==========================================
      - name: Run WebSocket Test
        run: |

          echo "=========================================="
          echo "Starting JMeter WebSocket Test"
          echo "=========================================="

          echo ""
          echo "JMX:"
          echo "Jmeter/WebSocket.jmx"

          echo ""
          echo "JTL:"
          echo "Jmeter/results/websocket/websocket.jtl"

          echo ""
          echo "HTML Report:"
          echo "Jmeter/results/websocket/html-report"

          echo ""
          echo "=========================================="

          ./jmeter-install/bin/jmeter \
            -n \
            -t Jmeter/WebSocket.jmx \
            -l Jmeter/results/websocket/websocket.jtl \
            -e \
            -o Jmeter/results/websocket/html-report

          echo ""
          echo "=========================================="
          echo "JMeter WebSocket Test Completed"
          echo "=========================================="


      # ==========================================
      # 11. Verify results
      # ==========================================
      - name: Verify results
        if: always()
        run: |

          echo "=========================================="
          echo "Generated Test Results"
          echo "=========================================="

          echo ""
          echo "All generated files:"

          find Jmeter/results/websocket \
            -type f \
            -print


          echo ""
          echo "=========================================="
          echo "JTL File"
          echo "=========================================="

          if [ -f "Jmeter/results/websocket/websocket.jtl" ]; then

            ls -lh Jmeter/results/websocket/websocket.jtl

          else

            echo "JTL file not found."

          fi


          echo ""
          echo "=========================================="
          echo "HTML Report"
          echo "=========================================="

          if [ -d "Jmeter/results/websocket/html-report" ]; then

            ls -lh Jmeter/results/websocket/html-report/

          else

            echo "HTML report directory not found."

          fi


      # ==========================================
      # 12. Upload Complete Results
      # ==========================================
      - name: Upload complete test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: websocket-complete-results-${{ github.run_number }}
          path: Jmeter/results/websocket/
          if-no-files-found: warn
          retention-days: 30
