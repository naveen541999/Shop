name: Run JMeter WebSocket Test

on:
  workflow_dispatch:

jobs:
  websocket-test:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Cache JMeter
      # ==========================================
      - name: Cache JMeter
        id: jmeter-cache
        uses: actions/cache@v4
        with:
          path: jmeter-install
          key: jmeter-5.6.3-linux


      # ==========================================
      # 4. Download JMeter if not cached
      # ==========================================
      - name: Download JMeter
        if: steps.jmeter-cache.outputs.cache-hit != 'true'
        run: |

          JMETER_VERSION=5.6.3

          echo "Downloading JMeter ${JMETER_VERSION}..."

          curl -L --fail --retry 3 \
            https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz \
            -o apache-jmeter.tgz

          echo "Extracting JMeter..."

          tar -xzf apache-jmeter.tgz

          mv apache-jmeter-${JMETER_VERSION} jmeter-install

          echo "JMeter installed successfully."


      # ==========================================
      # 5. Verify JMeter
      # ==========================================
      - name: Verify JMeter
        run: |

          echo "JMeter version:"

          ./jmeter-install/bin/jmeter --version


      # ==========================================
      # 6. Install WebSocket plugins
      # ==========================================
      - name: Install JMeter plugins
        run: |

          echo "Installing JMeter plugins..."

          if [ -d "jmeter/lib/ext" ]; then

            cp -v jmeter/lib/ext/*.jar jmeter-install/lib/ext/ || true

          else

            echo "No plugin directory found."

          fi

          echo ""
          echo "JMeter lib/ext contents:"
          ls -la jmeter-install/lib/ext/


      # ==========================================
      # 7. Create result directory
      # ==========================================
      - name: Prepare result directory
        run: |

          rm -rf jmeter/results/websocket

          mkdir -p jmeter/results/websocket/html-report

          echo "Result directory created."


      # ==========================================
      # 8. Run WebSocket JMeter test
      # ==========================================
      - name: Run WebSocket Test
        run: |

          echo "=========================================="
          echo "Starting JMeter WebSocket Test"
          echo "=========================================="

          ./jmeter-install/bin/jmeter \
            -n \
            -t jmeter/websocket.jmx \
            -l jmeter/results/websocket/websocket.jtl \
            -e \
            -o jmeter/results/websocket/html-report

          echo ""
          echo "=========================================="
          echo "JMeter test completed"
          echo "=========================================="


      # ==========================================
      # 9. Verify generated results
      # ==========================================
      - name: Verify results
        if: always()
        run: |

          echo "=========================================="
          echo "Generated files"
          echo "=========================================="

          find jmeter/results/websocket -type f -print

          echo ""
          echo "JTL file:"
          ls -lh jmeter/results/websocket/websocket.jtl || true

          echo ""
          echo "HTML report:"
          ls -lh jmeter/results/websocket/html-report/ || true


      # ==========================================
      # 10. Upload JTL
      # ==========================================
      - name: Upload JTL result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: websocket-jtl-${{ github.run_number }}
          path: jmeter/results/websocket/websocket.jtl
          if-no-files-found: warn
          retention-days: 30


      # ==========================================
      # 11. Upload HTML report
      # ==========================================
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: websocket-html-report-${{ github.run_number }}
          path: jmeter/results/websocket/html-report/
          if-no-files-found: warn
          retention-days: 30


      # ==========================================
      # 12. Upload complete results folder
      # ==========================================
      - name: Upload complete test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: websocket-complete-results-${{ github.run_number }}
          path: jmeter/results/websocket/
          if-no-files-found: warn
          retention-days: 30
