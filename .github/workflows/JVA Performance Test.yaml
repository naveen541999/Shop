name: JVA Performance Test

on:
  workflow_dispatch:
    inputs:
      threads:
        description: 'Number of Threads'
        default: '1'
        required: true
      duration:
        description: 'Duration (minutes)'
        default: '60'
        required: true
      rampup:
        description: 'Ramp-Up Period (minutes)'
        default: '5'
        required: true

env:
  JMETER_VERSION: 5.6.3
  JMETER_HOME: ${{ github.workspace }}/apache-jmeter-5.6.3

jobs:
  jmeter-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: feat/Performance_Testing

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java Version	
        run: java -version

      - name: Cache JMeter
        uses: actions/cache@v4
        id: cache-jmeter
        with:
          path: apache-jmeter-${{ env.JMETER_VERSION }}
          key: jmeter-${{ env.JMETER_VERSION }}

      - name: Download and Extract JMeter
        shell: bash
        run: |
          set -euo pipefail

          wget --progress=bar:force:noscroll \
            --timeout=30 \
            --tries=3 \
            -O apache-jmeter-${JMETER_VERSION}.tgz \
            https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz

          echo "Extracting JMeter..."
          tar -xzf apache-jmeter-${JMETER_VERSION}.tgz

          test -x "${JMETER_HOME}/bin/jmeter"

          echo "JMeter downloaded and extracted successfully"

      - name: Verify JMeter Installation
        run: |
          ${{ env.JMETER_HOME }}/bin/jmeter --version
          echo "JMeter Home: ${{ env.JMETER_HOME }}"
          echo "Plugins in lib/ext:"
          ls ${{ env.JMETER_HOME }}/lib/ext/

      - name: Install Plugins
        run: |
          echo "Copying plugins to JMeter lib/ext..."
          cp performance_testing/lib/*.jar ${{ env.JMETER_HOME }}/lib/ext/
          echo "Plugins installed:"
          ls ${{ env.JMETER_HOME }}/lib/ext/*.jar

      - name: Set Timestamp and Create Results Folder
        run: |
          echo "TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV
          mkdir -p results/HTMLReport

      - name: Run JMeter Test
        env:
          INPUT_DURATION: ${{ github.event.inputs.duration }}
          INPUT_RAMPUP: ${{ github.event.inputs.rampup }}
          INPUT_THREADS: ${{ github.event.inputs.threads }}
        run: |
          if ! [[ "$INPUT_DURATION" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid duration: $INPUT_DURATION" && exit 1
          fi
          if ! [[ "$INPUT_RAMPUP" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid rampup: $INPUT_RAMPUP" && exit 1
          fi
          if ! [[ "$INPUT_THREADS" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid threads: $INPUT_THREADS" && exit 1
          fi

          DURATION_SECS=$(( INPUT_DURATION * 60 ))
          RAMPUP_SECS=$(( INPUT_RAMPUP * 60 ))

          ${{ env.JMETER_HOME }}/bin/jmeter -n \
            -t performance_testing/JVA_TestScript.jmx \
            -l results/results.jtl \
            -e -o results/HTMLReport \
            -j results/jmeter.log \
            -Jthreads="$INPUT_THREADS" \
            -Jduration="$DURATION_SECS" \
            -Jrampup="$RAMPUP_SECS"

      - name: Collect Session Results CSV
        if: always()
        run: |
          CSV_FILE="${{ github.workspace }}/performance_testing/session_results.csv"
          if [ -f "$CSV_FILE" ]; then
            cp "$CSV_FILE" results/session_results.csv
            echo "session_results.csv collected - $(wc -l < results/session_results.csv) lines"
          else
            echo "Thread,SessionId,Turn1(sec),Turn2(sec),Turn3(sec),Turn4(sec)" > results/session_results.csv
            echo "Status: session_results.csv was not generated by the test"
          fi

      - name: Test Complete
        if: always()
        run: echo "Test completed."

      - name: Upload All Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JVA-Test-Results-${{ env.TIMESTAMP }}
          path: |
            results/results.jtl
            results/HTMLReport/
            results/session_results.csv
            results/jmeter.log
          retention-days: 30
          
